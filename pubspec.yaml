name: learn_video_app
description: "ครูพี่โฮม - Japanese course app"
publish_to: 'none'

version: 13.1.0+19

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_fonts: ^6.2.1
  go_router: ^14.2.0
  cupertino_icons: ^1.0.8
  local_auth: ^2.3.0
  smooth_page_indicator: ^1.2.0+3
  image_picker: ^1.1.2
  record: ^6.2.0
  audioplayers: ^6.1.0
  path_provider: ^2.1.5
  dio: ^5.4.0
  shared_preferences: ^2.2.2
  webview_flutter: ^4.7.0
  open_file: ^3.3.2
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/logo/
